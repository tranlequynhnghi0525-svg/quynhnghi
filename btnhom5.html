<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kho Tài Liệu Nhóm</title>

<style>
:root{
 --dark:#14532d;--green:#15803d;--bright:#22c55e;
 --light:#dcfce7;--page:#f0fdf4;--text:#1f2937;
 --shadow:0 5px 18px rgba(21,128,61,.13)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--page);line-height:1.65}
.hero{padding:55px 20px;text-align:center;color:white;background:linear-gradient(135deg,var(--dark),var(--green),var(--bright))}
.hero h1{margin:0 0 8px;font-size:clamp(1.8rem,5vw,2.7rem)}
.hero p{margin:0}
main{width:min(1100px,100%);margin:auto;padding:24px 20px 60px}
.section-title{color:var(--dark);font-size:1.5rem;margin:32px 0 18px;padding-left:12px;border-left:5px solid var(--bright)}
.members{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.member{background:white;border-top:5px solid var(--bright);border-radius:16px;padding:22px 14px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:.2s}
.member:hover{transform:translateY(-4px);background:var(--light)}
.avatar{width:84px;height:84px;margin:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;color:white;background:linear-gradient(135deg,var(--bright),var(--green));border:3px solid var(--light);font-size:2rem;font-weight:bold}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avatar.large{width:120px;height:120px;font-size:3rem}
.member h3{color:var(--dark);font-size:1.05rem;margin:10px 0 4px}
.pill{display:inline-block;padding:2px 11px;border-radius:99px;background:var(--light);color:var(--green);font-size:.83rem}
.more{display:block;margin-top:10px;color:var(--green);font-weight:600;font-size:.9rem}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.lesson-button{border:2px solid #bbf7d0;border-radius:14px;padding:16px;background:white;text-align:left;color:var(--text);font:inherit;cursor:pointer;box-shadow:var(--shadow);transition:.2s}
.lesson-button:hover{transform:translateY(-3px);border-color:var(--bright)}
.lesson-button.active{background:var(--green);border-color:var(--green);color:white}
.lesson-number{display:block;color:var(--green);font-size:1.3rem;font-weight:800}
.lesson-button.active .lesson-number{color:white}
.lesson-title{display:block;font-weight:600}
.viewer{margin-top:24px;background:white;border:1px solid #bbf7d0;border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.viewer-header{padding:20px 24px;background:var(--light)}
.viewer-header h2{margin:8px 0 2px;color:var(--dark)}
.viewer-content{padding:22px 26px;overflow-wrap:anywhere}
.viewer-content h3{margin:24px 0 8px;color:var(--dark)}
.viewer-content h4{margin:18px 0 6px;color:var(--green)}
.viewer-content ul,.viewer-content ol{padding-left:24px}
.viewer-content li{margin:6px 0}
.viewer-content pre{white-space:pre-wrap;overflow:auto;padding:14px;background:var(--page);border:1px solid #bbf7d0;border-radius:10px;font:14px/1.5 Consolas,monospace}
.viewer-content table{border-collapse:collapse;margin:12px 0;width:100%}
.viewer-content th,.viewer-content td{border:1px solid #bbf7d0;padding:8px;text-align:left}
.viewer-content th{background:var(--light)}
.viewer-content img{display:block;max-width:100%;height:auto;margin:16px auto;border-radius:12px}
.modal{position:fixed;inset:0;z-index:10;padding:16px;display:flex;align-items:center;justify-content:center;background:rgba(20,83,45,.6)}
.modal-box{position:relative;width:min(460px,100%);max-height:90vh;overflow:auto;padding:28px;background:white;border-radius:18px}
.close{position:absolute;right:12px;top:8px;border:0;background:none;color:var(--green);font-size:1.8rem;cursor:pointer}
.profile{text-align:center}
.profile h2{color:var(--dark);margin:10px 0 5px}
.profile-info{margin-top:16px;padding:12px 16px;border-radius:12px;background:var(--light);text-align:left}
.profile-info p{margin:5px 0}
.hidden{display:none!important}
footer{text-align:center;padding:20px;background:var(--dark);color:var(--light)}
@media(max-width:750px){.members{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.members{grid-template-columns:1fr}main{padding-inline:14px}.viewer-content{padding:18px}}
</style>
</head>

<body>
<header class="hero">
 <h1>🌿 Kho Tài Liệu Nhóm</h1>
 <p>Nơi lưu trữ và chia sẻ tài liệu của các thành viên</p>
</header>

<main>
 <section>
 <h2 class="section-title">Thành viên</h2>
 <div id="member-list" class="members"></div>
 </section>

 <section>
 <h2 class="section-title">Tài liệu theo bài</h2>
 <div id="lesson-list" class="lesson-grid"></div>
 <article id="viewer" class="viewer hidden">
 <div class="viewer-header">
 <span id="viewer-label" class="pill"></span>
 <h2 id="viewer-title"></h2>
 </div>
 <div id="viewer-content" class="viewer-content"></div>
 </article>
 </section>
</main>

<div id="modal" class="modal hidden">
 <div class="modal-box">
 <button id="close-modal" class="close" aria-label="Đóng">&times;</button>
 <div id="profile-content"></div>
 </div>
</div>

<footer>Kho Tài Liệu Nhóm</footer>

 <h3>LUYỆN TẬP</h3>
 <h4>Luyện tập 1: Muốn kết nối các máy tính trong phạm vi gia đình thành một mạng, nên dùng loại thiết bị kết nối nào?</h4>

 <li><b>Router Wi-Fi:</b> Lựa chọn phổ biến để tạo mạng gia đình, kết nối các thiết bị với Internet và với nhau qua Wi-Fi. Router cũng có thể có cổng Ethernet cho máy tính, TV thông minh hoặc máy in.</li>

 <li><b>Bộ kết nối Powerline:</b> Sử dụng dây điện trong nhà để truyền dữ liệu, giúp mở rộng mạng mà không cần kéo dây Ethernet.</li>

 <h4>Luyện tập 2: Làm thế nào để kết nối máy tính xách tay với Internet qua mạng điện thoại di động?</h4>

 <li>Dùng điện thoại di động phát Wi-Fi hoặc chia sẻ Internet với máy tính.</li>

 <h3>LUYỆN TẬP</h3>
 <h4>Luyện tập 1: Các quy tắc trong giao thức gọi điện thoại bằng máy bàn.</h4>
 <ul>
 <li><b>Nhấc ống nghe:</b> Báo cho trung tâm chuyển mạch muốn bắt đầu cuộc gọi.</li>
 <li><b>Quay số:</b> Nhập số điện thoại cần gọi.</li>
 <li><b>Chờ kết nối:</b> Hệ thống xử lý cuộc gọi; người gọi có thể nghe nhạc chờ hoặc thông báo.</li>
 <li><b>Báo chuông:</b> Điện thoại người nhận reo để báo có cuộc gọi đến.</li>
 <li><b>Nói chuyện:</b> Hai bên trao đổi sau khi kết nối.</li>
 <li><b>Kết thúc:</b> Một bên đặt ống nghe xuống hoặc nhấn nút kết thúc.</li>
 <li><b>Báo lỗi:</b> Hệ thống phát tín hiệu hoặc thông báo nếu cuộc gọi không thực hiện được.</li>
 </ul>

 <h4>Luyện tập 2: Đổi địa chỉ IP giữa dạng nhị phân và thập phân.</h4>
 <table>
 <thead><tr><th>Dạng nhị phân</th><th>Dạng thập phân</th></tr></thead>
 <tbody>
 <tr><td>11000000 10101000 00001101 11010010</td><td>192.168.13.210</td></tr>
 <tr><td>10000011 11010110 00010111 00010000</td><td>131.214.23.16</td></tr>
 </tbody>
 </table>

 <h3>VẬN DỤNG</h3>
 <h4>Vận dụng 1: Tìm hiểu giao thức tên miền DNS.</h4>
 <p><b>Lợi ích:</b> Tên miền dễ nhớ hơn địa chỉ IP; được tổ chức theo cấp bậc; khi địa chỉ IP thay đổi có thể cập nhật DNS mà không phải đổi tên miền.</p>
 <p><b>Các cấp tên miền:</b></p>
 <ul>
 <li><b>TLD:</b> Phần cuối tên miền, ví dụ .com, .org, .vn.</li>
 <li><b>SLD:</b> Ví dụ “example” trong example.com.</li>
 <li><b>Subdomain:</b> Ví dụ blog.example.com.</li>
 </ul>
 <p><b>Tên miền .vn:</b> Trung tâm Internet Việt Nam (VNNIC) quản lý tên miền quốc gia .vn.</p>

 <h4>Vận dụng 2: Tìm hiểu lệnh ping.</h4>
 <p>Ping dùng các gói ICMP Echo Request và Echo Reply để kiểm tra kết nối giữa các thiết bị. Thời gian phản hồi thường được tính bằng mili giây (ms).</p>
 <p>Mở cửa sổ dòng lệnh và nhập:</p>
 <pre>ping www.google.com</pre>
 <p>Cũng có thể ping địa chỉ IP, ví dụ: <code>ping 8.8.8.8</code>.</p>

 <h3>CÂU HỎI TRANG 53</h3>
 <h4>Tạo danh sách lồng nhau: mức 1 đánh số 1, 2, 3; mức 2 đánh số a, b, c.</h4>
 <p>Dùng <code>ol</code> cho danh sách ngoài và <code>ol type="a"</code> cho danh sách con:</p>
 <pre><code>&lt;ol&gt;
 &lt;li&gt;Mục 1&lt;/li&gt;

 &lt;ol type="a"&gt;
 &lt;li&gt;Mục con a&lt;/li&gt;
 &lt;li&gt;Mục con b&lt;/li&gt;
 &lt;li&gt;Mục con c&lt;/li&gt;
 &lt;/ol&gt;
 &lt;/li&gt;
 &lt;li&gt;Mục 3&lt;/li&gt;
&lt;/ol&gt;</code></pre>

 <h4>Hoạt động 2: Nên dùng danh sách hay bảng cho thông tin món ăn?</h4>
 <p>Nên dùng <b>bảng</b>, vì mỗi món có nhiều thông tin như đơn giá, số lượng và tổng tiền. Bảng giúp sắp xếp thông tin theo hàng, cột và dễ so sánh.</p>
 <ul>

const $ = selector => document.querySelector(selector);
const getMember = id => members.find(member => member.id === id);

function initials(name){
 return name.trim().split(" ").pop().charAt(0).toUpperCase();
}

function avatarHTML(member, large=false){
 const photo = member.image
 ? `<img src="${member.image}" alt="" onerror="this.remove()">`
 : "";
 return `<div class="avatar ${large ? "large" : ""}">
 <span>${initials(member.name)}</span>${photo}
 </div>`;
}

function renderMembers(){
 $("#member-list").innerHTML = members.map(member => `
 <article class="member" data-id="${member.id}" tabindex="0">
 ${avatarHTML(member)}
 <h3>${member.name}</h3>
 <span class="pill">Thành viên</span>
 <span class="more">Xem giới thiệu →</span>
 </article>
 `).join("");

 document.querySelectorAll(".member").forEach(card => {
 card.addEventListener("click", () => showProfile(card.dataset.id));
 card.addEventListener("keydown", event => {
 if(event.key === "Enter" || event.key === " "){
 event.preventDefault();
 showProfile(card.dataset.id);
 }
 });
 });
}

function showProfile(id){
 const member = getMember(id);
 $("#profile-content").innerHTML = `
 <div class="profile">
 ${avatarHTML(member, true)}
 <h2>${member.name}</h2>
 <span class="pill">Thành viên</span>
 <div class="profile-info">
 <p>🎂 <b>Ngày sinh:</b> ${member.birthday}</p>
 <p>⭐ <b>Sở thích:</b> ${member.hobby}</p>
 </div>
 </div>
 `;
 $("#modal").classList.remove("hidden");
}

function closeProfile(){
 $("#modal").classList.add("hidden");
}

function renderLessons(){
 $("#lesson-list").innerHTML = lessons.map((lesson,index) => `
 <button class="lesson-button" data-index="${index}">
 <span class="lesson-number">Bài ${lesson.number}</span>
 <span class="lesson-title">${lesson.title}</span>
 </button>
 `).join("");

 document.querySelectorAll(".lesson-button").forEach(button => {
 button.addEventListener("click", () => showLesson(Number(button.dataset.index)));
 });
}

function showLesson(index){
 const lesson = lessons[index];

 document.querySelectorAll(".lesson-button").forEach((button,i) => {
 button.classList.toggle("active", i === index);
 });

 $("#viewer-label").textContent = "BÀI " + lesson.number;
 $("#viewer-title").textContent = lesson.title;
 $("#viewer-content").innerHTML = lesson.content;
 $("#viewer").classList.remove("hidden");
 $("#viewer").scrollIntoView({behavior:"smooth",block:"start"});
}

$("#close-modal").addEventListener("click", closeProfile);
$("#modal").addEventListener("click", event => {
 if(event.target.id === "modal") closeProfile();
});
document.addEventListener("keydown", event => {
 if(event.key === "Escape") closeProfile();
});

renderMembers();
renderLessons();
</script>
